name: Legal RAG Eval CI

on:
  workflow_dispatch:
    inputs:
      rag_url:
        description: "Deployed RAG base URL to evaluate"
        required: false
        default: "https://backend-59tk.onrender.com"
      report_name:
        description: "Report name prefix"
        required: false
        default: "ci_run"

  schedule:
    - cron: "0 2 * * *"

  repository_dispatch:
    types: [legal-rag-push]

env:
  RAG_BASE_URL: ${{ github.event.inputs.rag_url || vars.RAG_BASE_URL || 'https://backend-59tk.onrender.com' }}
  REPORT_NAME: ${{ github.event.inputs.report_name || 'ci_run' }}
  PYTHON_VERSION: "3.11"

jobs:
  run-eval:
    name: Run Eval Harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout eval repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for deployed RAG
        run: |
          echo "Checking $RAG_BASE_URL/api/v1/health"
          for i in $(seq 1 30); do
            status=$(curl --max-time 30 -sS -o health.json -w "%{http_code}" \
              "$RAG_BASE_URL/api/v1/health" || true)
            if [ "$status" = "200" ]; then
              cat health.json
              echo "RAG is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30 returned HTTP ${status:-000}; retrying in 20s"
            sleep 20
          done
          echo "::error::Deployed RAG did not become healthy: $RAG_BASE_URL"
          exit 1

      - name: Run eval harness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SKIP_LLM_METRICS: ${{ secrets.OPENAI_API_KEY == '' && 'true' || 'false' }}
        run: |
          python runner.py \
            --base-url "$RAG_BASE_URL" \
            --report "$REPORT_NAME"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-${{ env.REPORT_NAME }}
          path: reports/${{ env.REPORT_NAME }}_report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Write workflow summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("reports") / f"{os.environ['REPORT_NAME']}_report.json"
          if not path.exists():
              print("No report was generated.")
              raise SystemExit(0)

          report = json.loads(path.read_text())
          summary = report.get("summary", {})
          aggregate = summary.get("aggregate", {})
          ci = report.get("ci", {})
          icon = "✅" if ci.get("passed") else "❌"
          lines = [
              f"## {icon} Legal RAG Eval Results",
              "",
              "| Metric | Score |",
              "|---|---:|",
              f"| Citation accuracy | {aggregate.get('citation_accuracy', 0):.3f} |",
              f"| Hallucination rate | {aggregate.get('hallucination_rate', 0):.3f} |",
              f"| Answer relevancy | {aggregate.get('answer_relevancy', 0):.3f} |",
              f"| Source attribution | {aggregate.get('source_attribution_avg', 0):.3f} |",
              f"| Conflict detection | {aggregate.get('conflict_detection_avg', 0):.3f} |",
              "",
              f"Questions evaluated: {summary.get('total_questions', 0)}",
              f"Errors: {summary.get('errored', 0)}",
          ]
          breaches = ci.get("breaches", [])
          if breaches:
              lines.extend(["", "### Threshold breaches"])
              lines.extend(f"- {breach}" for breach in breaches)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n".join(lines) + "\n")
          PY
